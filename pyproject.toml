[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyvault"
version = "0.1.0"
description = "PolyVault is a Python library that provides a unified interface for secrets management across multiple vault providers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["hvac", "vault", "azurevault", "openbao", "kv", "secret"]
authors = [
    { name = "Amogha Hegde" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/Amogha-Hegde/ployvault"
Repository = "https://github.com/Amogha-Hegde/ployvault"
Issues = "https://github.com/Amogha-Hegde/ployvault/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["ployvault*"]

[tool.setuptools.package-data]
ployvault = [".agents/skills/*/SKILL.md"]
